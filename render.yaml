services:
  - type: web
    name: luminocity-logistica
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build && npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
